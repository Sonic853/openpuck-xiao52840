name: Build Xiao nRF52840

on:
  pull_request:
  push:
    branches:
      - main
      - feat/xiao-nrf52840-s140-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xiao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install DFU packager
        run: pip install adafruit-nrfutil
      - name: Test UF2 validation and build isolation
        run: python tools/test-xiao-layout.py
      - name: Build Xiao with pinned dependencies
        run: python tools/build-xiao.py --install-deps
      - uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-xiao-s140-7.3.0-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/xiao/OpenPuck-xiao-s140-7.3.0.uf2
            build/xiao/OpenPuck.ino.hex
